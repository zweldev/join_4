<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Join 4 web app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="join 4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>join 4</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --bg-top: #1B2838;
      --bg-bottom: #0A0E14;
      --accent: #60A5FA;
      --player-x: #FF5C6C;
      --player-o: #2DD4BF;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 60%, #0F172A 100%);
      color: #f5f5f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.03), transparent 36%), linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 60%, #0F172A 100%);
      z-index: 9999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      opacity: 1;
      visibility: visible;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Lobby-style token-drop loader */
    .loader-board {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
    }

    .board {
      width: 200px;
      height: 50px;
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6), inset 0 -6px 18px rgba(0, 0, 0, 0.45);
    }

    .slot {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 50%;
      background: #0C1220;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.6);
    }

    .drop-row {
      position: relative;
      height: 48px;
      display: flex;
      gap: 18px;
      align-items: flex-end;
      justify-content: center;
    }

    .disc {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6), inset 0 -6px 10px rgba(255, 255, 255, 0.04);
      transform-origin: center;
    }

    .disc.small {
      transform: scale(0.88);
    }

    .disc-x {
      background: var(--player-x);
    }

    .disc-o {
      background: var(--player-o);
    }

    .drop {
      position: relative;
      top: -80px;
      opacity: 0;
      animation: drop 1.05s cubic-bezier(.2, .9, .25, 1) var(--delay, 0s) infinite;
    }

    @keyframes drop {
      0% {
        transform: translateY(-80px) scale(.95);
        opacity: 0;
      }

      55% {
        transform: translateY(8px) scale(1.04);
        opacity: 1;
      }

      80% {
        transform: translateY(-6px) scale(.98);
      }

      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .loading-copy {
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      color: rgba(245, 245, 247, 0.92);
    }

    .loading-copy strong {
      color: #ffffff;
      font-weight: 700;
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loader-board" role="img" aria-label="Join 4 loading">
      <div class="board" aria-hidden="true">
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>

      <div class="drop-row" aria-hidden="true">
        <div class="drop" style="--delay:0s">
          <div class="disc disc-x"></div>
        </div>
        <div class="drop" style="--delay:0.12s">
          <div class="disc disc-o"></div>
        </div>
        <div class="drop" style="--delay:0.24s">
          <div class="disc disc-x small"></div>
        </div>
      </div>

      <div class="loading-copy">
        <strong>Join 4</strong>
        <div>Preparing the board and players…</div>
      </div>
    </div>
  </div>
  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const hideLoading = () => {
      if (!loadingScreen.classList.contains('hidden')) {
        loadingScreen.classList.add('hidden');
      }
    };

    window.addEventListener('flutter-first-frame', hideLoading);
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>

</html>
