
<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="join 4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>join 4</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      background: #0c0c14;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0c0c14;
      color: #f5f5f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.05), transparent 36%),
        linear-gradient(180deg, #0c0c14 0%, #07070d 100%);
      z-index: 9999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      opacity: 1;
      visibility: visible;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #8ab4f8;
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .loading-copy {
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      color: rgba(245, 245, 247, 0.88);
    }

    .loading-copy strong {
      color: #ffffff;
      font-weight: 600;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loader-ring"></div>
    <div class="loading-copy">
      <strong>join 4</strong> is waking up.
      <div>One moment while the board loads.</div>
    </div>
  </div>
  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const hideLoading = () => {
      if (!loadingScreen.classList.contains('hidden')) {
        loadingScreen.classList.add('hidden');
      }
    };

    window.addEventListener('flutter-first-frame', hideLoading);
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>

</html>
